services:
  ingester:
    build: .
    image: ingester-template
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BODY_LIMIT: ${BODY_LIMIT:-1048576}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MAIL_FIELD: ${MAIL_FIELD:-}
      MAIL_ENCODING: ${MAIL_ENCODING:-auto}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
