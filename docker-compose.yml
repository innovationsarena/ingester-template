services:
  ingester:
    build: .
    image: ingester-template
    restart: unless-stopped
    # Longer than JOB_DRAIN_TIMEOUT_MS, so shutdown can finish the mail in progress.
    stop_grace_period: 40s
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BODY_LIMIT: ${BODY_LIMIT:-31457280}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MAIL_FIELD: ${MAIL_FIELD:-}
      MAIL_ENCODING: ${MAIL_ENCODING:-auto}
      # Must resolve from inside the container: host.docker.internal or a
      # service name on a shared network — never localhost.
      DOCLING_URL: ${DOCLING_URL:-}
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_TIMEOUT_MS: ${DOCLING_TIMEOUT_MS:-120000}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-26214400}
      MCP_URL: ${MCP_URL-https://gr-mcp.innovationsarenan.se/mcp}
      MCP_TIMEOUT_MS: ${MCP_TIMEOUT_MS:-30000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-1}
      QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-5}
      DEDUPE_TTL_S: ${DEDUPE_TTL_S:-604800}
      JOB_DRAIN_TIMEOUT_MS: ${JOB_DRAIN_TIMEOUT_MS:-30000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Holds the ingest queue. AOF persistence is what lets queued mail survive a
  # restart; BullMQ requires noeviction, or Redis may silently drop jobs.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
